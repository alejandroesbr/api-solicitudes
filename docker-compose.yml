services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_solicitudes_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_DATABASE=/app/data/database.sqlite
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
    driver: local
